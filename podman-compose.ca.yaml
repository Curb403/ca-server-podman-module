version: '3.8'

services:
  ca-server:
    build: .
    container_name: ca-server
    ports:
      - "8444:8444"  # API порт
    volumes:
      - ./data:/app/data:Z
      - ../certs:/app/certs:Z  # Общая папка для сертификатов
    environment:
      - CA_HOST=0.0.0.0
      - CA_PORT=8443
      - API_PORT=8444
    restart: unless-stopped